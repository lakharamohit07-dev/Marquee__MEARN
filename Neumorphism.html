<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphism Social Profile</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#e0e5ec;
    }

    .card{
      width:340px;
      padding:35px;
      border-radius:25px;
      background:#e0e5ec;
      text-align:center;

      box-shadow:
        10px 10px 20px #b8bec7,
        -10px -10px 20px #ffffff;
    }

    .profile-img{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:20px;

      box-shadow:
        8px 8px 15px #b8bec7,
        -8px -8px 15px #ffffff;
    }

    h2{
      color:#333;
      margin-bottom:10px;
    }

    p{
      color:#666;
      font-size:15px;
      line-height:24px;
      margin-bottom:25px;
    }

    .social-icons{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-bottom:25px;
    }

    .social-icons a{
      width:50px;
      height:50px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      color:#333;
      font-size:20px;
      background:#e0e5ec;

      box-shadow:
        6px 6px 12px #b8bec7,
        -6px -6px 12px #ffffff;

      transition:0.3s;
    }

    .social-icons a:hover{
      box-shadow:
        inset 6px 6px 12px #b8bec7,
        inset -6px -6px 12px #ffffff;

      transform:scale(0.95);
    }

    .btn{
      padding:12px 28px;
      border:none;
      border-radius:12px;
      background:#e0e5ec;
      cursor:pointer;
      font-size:16px;
      color:#333;

      box-shadow:
        6px 6px 12px #b8bec7,
        -6px -6px 12px #ffffff;

      transition:0.3s;
    }

    .btn:hover{
      box-shadow:
        inset 6px 6px 12px #b8bec7,
        inset -6px -6px 12px #ffffff;
    }

  </style>
</head>
<body>

  <div class="card">

    <img src="https://i.pravatar.cc/200" class="profile-img">

    <h2>Mohit Lakhara</h2>

    <p>
      B.Tech student passionate about Web Development,
      Java, DSA and modern UI designing.
    </p>

    <div class="social-icons">

      <a href="#">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="#">
        <i class="fa-brands fa-facebook-f"></i>
      </a>

      <a href="#">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <a href="#">
        <i class="fa-brands fa-github"></i>
      </a>

    </div>

    <button class="btn">Follow</button>

  </div>

</body>
</html>
