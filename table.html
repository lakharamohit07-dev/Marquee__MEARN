<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
    <style>
        table,
        td,
        th,
        tr{
            border: 1px solid;
            border-collapse: collapse;
            padding: 5px;
        }
        thead{
            background-color: olive;
        }
    </style>
</head>
<body>
    <table>
        <thead>
        <tr>
            <th>Emp. Code</th>
            <th>Emp. Name</th>
            <th>JOb</th>
            <th>Salary(LPA)</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>911</td>
                <td>Zoya Shaikh</td>
                <td>Developer</td>
                <td>25</td>
            </tr>
            <tr>
                <td>912</td>
                <td>Zeff</td>
                <td>Stakeholder</td>
                <td>30</td>
                <tr>
                <td>913</td>
                <td>Harry</td>
                <td>Editor</td>
                <td>20</td>
            </tr>
            <tr>
                <td>914</td>
                <td>Joe</td>
                <td>Manager</td>
                <td>15</td>
            </tr>
            <tr>
                <td>915</td>
                <td>Simren </td>
                <td>Tester</td>
                <td>30</td>
            </tr>
            </tr>
        </tbody>
        <tfoot>
            <td colspan="4">This is Table</td>
        </tfoot>
    </table>
</body>
</html>
