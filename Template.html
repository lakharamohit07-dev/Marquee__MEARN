<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Landing Page</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #ffffff;
      }

      header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 25px 80px;
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        font-style: italic;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 30px;
      }

      nav a {
        text-decoration: none;
        color: #111;
        font-size: 15px;
      }

      .install-btn {
        padding: 10px 22px;
        border: 2px solid #111;
        background: white;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 4px 4px 0 black;
        transition: 0.3s;
      }

      .install-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 black;
      }

      .hero {
        text-align: center;
        margin-top: 70px;
      }

      .hero h5 {
        letter-spacing: 4px;
        color: #555;
        margin-bottom: 20px;
      }

      .hero h1 {
        font-family: Georgia, serif;
        font-size: 60px;
        line-height: 1.2;
        width: 900px;
        max-width: 90%;
        margin: auto;
        color: #111;
      }

      .hero p {
        width: 720px;
        max-width: 90%;
        margin: 30px auto;
        color: #555;
        line-height: 1.7;
        font-size: 18px;
      }

      .learn-btn {
        margin-top: 15px;
        padding: 14px 34px;
        background: white;
        border: 2px solid black;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 5px 5px 0 black;
        transition: 0.3s;
      }

      .learn-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0 black;
      }

      .companies {
        margin: 120px auto 40px;
        width: 85%;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        gap: 40px;
      }

      .company {
        font-size: 34px;
        color: #666;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          gap: 20px;
          padding: 20px;
        }

        nav {
          flex-wrap: wrap;
          justify-content: center;
        }

        .hero h1 {
          font-size: 38px;
        }

        .hero p {
          font-size: 16px;
        }

        .company {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><strong>GENERATOR</strong></div>

      <nav>
        <a href="#">Home</a>
        <a href="#">Pages ▼</a>
        <a href="#">Blog ▼</a>
        <a href="#">Templates ▼</a>

        <button class="install-btn">Install Theme</button>
      </nav>
    </header>

    <section class="hero">
      <h5>HOME PAGE</h5>

      <h1>Build and manage your HubSpot website without code.</h1>

      <p>
        This HubSpot website theme provides marketers with the tools they need
        to build modern websites, landing pages and blogs on HubSpot without a
        developer.
      </p>

      <button class="learn-btn">Learn More</button>
    </section>

    <section class="companies">
      <div class="company">Lacoste</div>
      <div class="company"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-hZzN9iBkpxee_Gs3mdUX32GgxWIlibm9ee1TLD4U5A&s"></div>
      <div class="company">HubSpot</div>
      <div class="company">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyQb9ULe50FO4KvwUyGyfmDFQF2tYfPrZcyqUXf4ch&s"
        />
      </div>
    </section>
  </body>
</html>
