<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxModel</title>

    <style>
        body {
            background-color: rgb(255, 255, 255);
        }
        h1 {
            color: navy;
            margin-left: 20px;
            border: 5px solid black;
            background-color: rgb(255, 0, 0);
        }
        h3 {
            color: navy;
            margin-left: 20px;
            border: 5px solid black;
            background-color: rgb(255, 0, 0);
        }
        p {
            font-family: verdana;
            font-size: 20px;
            border: 5px solid black;
            background-color: rgb(0, 187, 255);
        }
        ul {
            font-family: verdana;
            font-size: 20px;
            padding: 20px;
        }
        .content {
            background-color: rgb(255, 0, 0);
            padding: 20px;
            border: 5px solid black;
            margin: 20px;
        }
        </style>
</head>
<body>
    <h1>Box Model</h1>
    <p>Every element on the page has its own box, which can be styled using CSS.</p>
    <p>From the inside out: </p>
    <ul>
        <li>Content</li>
        <li>Padding</li>
        <li>Border</li>
        <li>Margin</li>

    <h2>Background</h2>
    <p>Keep in mind that a background will cover the content and the padding.</p>
    </body>
</html>
